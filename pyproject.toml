[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-service"
version = "0.1.0"
description = "Production-ready RAG agent service (FastAPI + LangGraph) with pluggable vector stores and domain-separated knowledge bases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Platform Engineering", email = "platform@example.com" }]
maintainers = [{ name = "Platform Engineering", email = "platform@example.com" }]
keywords = ["fastapi", "langchain", "langgraph", "rag", "vector-store", "erp"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "PyJWT>=2.9.0",
  "tenacity>=8.5.0",
  "httpx>=0.27.0",
  "anyio>=4.4.0",
  "langchain-core>=1.2.22,<2",
  "langchain-text-splitters>=1.1.2,<2",
  "langgraph>=1.0.10,<2",
  "langgraph-checkpoint>=4.1.1,<5",
  "langgraph-sdk>=0.3.15",
  "pypdf>=4.3.0",
  "docx2txt>=0.8",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5.5,<2"]
faiss = ["faiss-cpu>=1.8.0", "numpy>=1.26"]
pinecone = ["pinecone>=5.0.0"]
openai = ["langchain-openai>=1.0.0,<2"]
anthropic = ["langchain-anthropic>=1.0.0,<2"]
huggingface = ["langchain-huggingface>=1.0.0,<2", "sentence-transformers>=3.0.0"]
local = ["agent-service[chroma,faiss]"]
all = ["agent-service[chroma,faiss,pinecone,openai,anthropic,huggingface]"]
dev = [
  "agent-service[chroma,faiss]",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-requests",
  "bandit[toml]>=1.7.9",
  "pip-audit>=2.7.3",
  "codespell>=2.3.0",
  "pre-commit>=3.8.0",
]

[project.urls]
Homepage = "https://example.com/agent-service"
Documentation = "https://example.com/agent-service/docs"
Source = "https://example.com/agent-service"

[project.scripts]
agent-service = "agent_service.main:run"

[tool.hatch.build.targets.wheel]
packages = ["agent_service"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent_service", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort (import sorting)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RET",  # return
  "PTH",  # use pathlib
  "ASYNC",
  "S",    # bandit-ish
  "T20",  # no print
  "RUF",
]
ignore = [
  "E501",   # handled by the formatter
  "B008",   # FastAPI Depends() in defaults
  "RUF012", # mutable class attrs need ClassVar (noisy with pydantic)
  "S104",   # binding to 0.0.0.0 is intentional in containers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "T20"]
"scripts/**" = ["T20", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["agent_service"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
# 3.12 matches the CI typecheck job; some third-party stubs (numpy) require it.
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = false
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
files = ["agent_service"]

[[tool.mypy.overrides]]
module = [
  "chromadb.*",
  "faiss.*",
  "pinecone.*",
  "langchain_openai.*",
  "langchain_anthropic.*",
  "langchain_huggingface.*",
  "langgraph.*",
  "docx2txt.*",
  "pypdf.*",
  "bs4.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest / coverage
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: tests that require live third-party credentials (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agent_service"]
branch = true
omit = ["agent_service/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "\\.\\.\\.",
]

# --------------------------------------------------------------------------
# bandit
# --------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# B101: asserts are used for invariants, not validation.
# B104: binding to 0.0.0.0 is the intended default inside a container.
skips = ["B101", "B104"]
